  # Open WebUI — single-container self-hosted LLM front-end.
  # SQLite + a bundled vector store live on a named volume. Runs as
  # container-root (the upstream image ships no non-root user; a forced UID
  # breaks the SQLite DB) with cap_drop: ALL and no added caps. Open WebUI is a
  # front-end only — it needs a model provider (a local Ollama instance or an
  # external model API key, both config-only via env_file) to actually chat.
  # ============================================================================
  - app_id: openwebui
    name: Open WebUI
    summary: Self-hosted web interface for local and remote large language models with multi-user chat and RAG.
    description: |
      Extensible, self-hosted web front-end for large language models — a
      private chat UI for a local Ollama instance or any OpenAI-compatible
      API. Single container with SQLite and a bundled vector store on a named
      volume, so chats, settings, and retrieval data survive a recreate. Open
      WebUI is a front-end only: it boots and serves the UI without a provider,
      but cannot chat until one is connected. The container runs as
      container-root (the upstream image provides no non-root user and forcing a
      non-root UID breaks its SQLite database) with cap_drop: ALL, no added
      capabilities, and no-new-privileges. First boot downloads a small
      embedding model over the network for built-in retrieval, so the front
      network keeps internet egress.
    template_name: openwebui
    template_version: "2026-06-14"
    compose_template: templates/openwebui/docker-compose.yml.tmpl
    env_template: templates/openwebui/.env.tmpl

    supported_versions:
      docker: ">=20.10"
      compose: ">=2.0"

    placeholders:
      # Session-cookie signing key. regenerable=false:
      # rotating it logs every user out (no data loss), so the update path
      # reuses the existing value from .env via state.ReadStackEnv (Residual
      # #31) rather than churning everyone's session. Token-like secret → hex.
      - name: WEBUI_SECRET_KEY
        type: secret
        required: true
        encoding: hex
        regenerable: false

      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

    ports:
      - service: openwebui
        container: 8080        # Open WebUI's internal HTTP port
        host: 8071             # default host port — installer may override

    image_pins:
      - service: openwebui
        image: ghcr.io/open-webui/open-webui
        tag: 0.9.5

    networks:
      # Front: reverse proxy reaches Open WebUI here (or via 127.0.0.1:8071).
      # NOT --internal: the app needs egress for the first-boot embedding-model
      # download and to reach external model providers.
      - name: openwebui
        internal: false

    resources:
      # openwebui: idle ~1.0 GiB resident once the embedding model is loaded
      # (measured at idle), ~20 pids. Recommended 2g / 1.0 cpu suits a
      # small VPS browsing + light chat; min 1536m sits above the resident
      # footprint with headroom so a min-fallback install does not OOM on the
      # first-boot model load (a flat 1g floor is below the measured resident
      # set); max is the override ceiling for heavier local workloads (NOT the
      # auto-selected default).
      - service: openwebui
        memory:
          min: 1536m
          recommended: 2g
          max: 4g
        cpus:
          min: "0.5"
          recommended: "1.0"
          max: "4.0"
        pids:
          default: 300
          max: 600
        allow_override: true

