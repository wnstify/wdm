# wdm stable catalog — the curated nineteen-app v1 stable catalog
#
# Validated against catalog/schema.json (draft 2020-12). Loaded from
# ~/.local/share/wdm/catalogs/stable/catalog.yaml at runtime (PRD §22).
#
# Anchors:
#   - PRD §15 names the curated v1 app set (nineteen apps): Uptime Kuma, FreshRSS,
#     Jellyfin, n8n, Navidrome, OpenWebUI, SerpBear, qBittorrent, Syncthing,
#     Baserow, Nextcloud, DocuSeal, Vaultwarden, Authentik, MeshCentral,
#     wg-adguard (WireGuard + AdGuard), Zulip, Dockhand, Stoat.
#   - PRD §16 fixes the install-finish-screen format used for pangolin_guidance.
#   - PRD §20 enumerates the risk tags (safe, major, database, complex).
#   - PRD §11 enforces 127.0.0.1 host port binding (carried by the Compose template,
#     not the catalog — port records here describe host/container pairs only).
#   - compose_template / env_template paths resolve relative to the repo root
#     ("templates/<app>/docker-compose.yml.tmpl" and ".env.tmpl").
#   - TZ semantics: an empty timezone triggers a system lookup at install
#     planning time; there is no Compose-level default fallback.
#   - regenerable=false secrets are reused on update (rotation = data loss).
#   - PUID/PGID are never declared as placeholders — they come from
#     wdm-resolved built-in template vars (.UID / .GID).
#   - SQL-identifier placeholder names are forbidden in apps whose
#     additional_files declare a .sh/.sql init script (n8n).
#   - The resources band shape pins the small-VPS "recommended" benchmark —
#     recommended is the typical install default, not the upstream template
#     maintainer's machine value; max is an override ceiling, never the
#     auto-selected default.

schema_version: 2
channel: stable
generated_at: "2026-06-23T16:00:00Z"

apps:

  # ============================================================================
  # Uptime Kuma — self-hosted monitoring with an external MariaDB backend.
  # Two services on two networks (front + internal DB). Owns its own database,
  # so any update path that touches mariadb is database-risk.
  # ============================================================================
  - app_id: uptime-kuma
    name: Uptime Kuma
    summary: Self-hosted uptime monitoring with status pages and 90+ notification channels.
    description: |
      Self-hosted monitoring tool for tracking uptime of websites, APIs, and
      services. Beautiful UI, multiple notification channels, public status
      pages, and a hardened MariaDB backend on an internal-only network. The
      MariaDB container exposes no internet egress; only the uptime-kuma app
      container reaches it across the kuma-db network.
    template_name: uptime-kuma
    template_version: "2026-05-20"
    compose_template: templates/uptime-kuma/docker-compose.yml.tmpl
    env_template: templates/uptime-kuma/.env.tmpl

    supported_versions:
      docker: ">=20.10"   # PRD §2
      compose: ">=2.0"    # PRD §2 — Compose V2

    placeholders:
      # MariaDB root password — required for MARIADB_ROOT_PASSWORD on first-run
      # init. regenerable=false: rotating a MariaDB root password post-install
      # requires ALTER USER inside the container, which wdm does not
      # orchestrate. Update path reuses the value from .env via
      # state.ReadStackEnv.
      - name: MARIADB_ROOT_PASSWORD
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # Non-root DB user password — same rotation cost as the root password
      # (ALTER USER required). regenerable=false.
      - name: UPTIME_KUMA_DB_PASSWORD
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # Timezone placeholder. Empty → wdm system lookup at install planning
      # time. No Compose-level default — wdm is the authoritative resolver,
      # no hardcoded fallback.
      - name: TZ
        type: timezone
        required: false

    ports:
      - service: uptime-kuma
        container: 3001     # uptime-kuma's internal HTTP port
        host: 3008          # default host port — installer may override

    image_pins:
      - service: mariadb
        image: docker.io/mariadb
        tag: 11.8.6
      - service: uptime-kuma
        image: docker.io/louislam/uptime-kuma
        tag: 2.3.2

    # PRD §12.2: the capabilities each service re-adds above the cap_drop: ALL
    # baseline, mirrored exactly from the Compose template so the rendered
    # cap_add and this declaration stay in parity. mariadb needs the minimal
    # caps the entrypoint uses for first-run chown + privilege drop to
    # mysql:mysql; uptime-kuma needs NET_RAW for the ICMP ping monitor.
    service_hardening:
      - service: mariadb
        capabilities:
          add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER
      - service: uptime-kuma
        capabilities:
          add:
            - NET_RAW

    networks:
      # Front: reverse proxy reaches uptime-kuma here (or via 127.0.0.1:3008).
      - name: kuma
        internal: false
      # Backend: kuma <-> mariadb only; created with --internal so MariaDB
      # has no internet egress.
      - name: kuma-db
        internal: true

    resources:
      # mariadb: small relational DB sized for an uptime-monitoring workload.
      # Recommended 512m / 0.5 cpu fits a 2-4 GiB VPS; min covers the
      # mariadb 11 startup footprint with no spare; max is the override
      # ceiling for larger users (NOT the auto-selected default).
      - service: mariadb
        memory:
          min: 256m
          recommended: 512m
          max: 2g
        cpus:
          min: "0.25"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 200
          max: 400
        allow_override: true

      # uptime-kuma: Node.js app — lightweight outside of ping fan-out spikes.
      # Recommended 256m / 0.5 cpu suits a small VPS with 10-50 monitors.
      - service: uptime-kuma
        memory:
          min: 128m
          recommended: 256m
          max: 1g
        cpus:
          min: "0.1"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 200
          max: 400
        allow_override: true

    # PRD §20: stack contains a MariaDB instance the user owns. Database-tag
    # triggers the §20 warning + explicit --accept-database-risk confirmation
    # on every update path.
    risk_classification:
      - database

    local_target_url_template: "http://127.0.0.1:3008"

    # Structured guidance: the install
    # result carries these fields verbatim; nothing here is parsed
    # from README prose.
    pangolin_guidance:
      target_url: "http://127.0.0.1:3008"
      recommended_subdomain: status
      notes:
        - "Guide: https://youtu.be/tTyq9xGy1pM"
        - "Using your own reverse proxy? Point it to http://127.0.0.1:3008"

  # ============================================================================
  # FreshRSS — single-container RSS aggregator, SQLite default.
  # No external DB process, no inter-service auth, no secrets. The simplest
  # entry in the curated set.
  # ============================================================================
  - app_id: freshrss
    name: FreshRSS
    summary: Self-hosted RSS feed aggregator with multi-user support and a built-in refresh scheduler.
    description: |
      Free, self-hosted RSS aggregator. Lightweight, fast, and privacy-focused.
      Apache + PHP single-process container (upstream-official image, not LSIO)
      with SQLite as the default database — the FreshRSS project endorses
      SQLite "for most cases". Supports Google Reader and Fever APIs for
      mobile clients.
    template_name: freshrss
    template_version: "2026-05-20"
    compose_template: templates/freshrss/docker-compose.yml.tmpl
    env_template: templates/freshrss/.env.tmpl

    supported_versions:
      docker: ">=20.10"
      compose: ">=2.0"

    placeholders:
      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

      # Built-in cron minute field. The Compose template carries no
      # ${CRON_MIN:-3,33} default; the catalog supplies the default here so
      # wdm renders a concrete value into .env.
      - name: CRON_MIN
        type: string
        required: false
        default: "3,33"

    ports:
      - service: freshrss
        container: 80        # Apache inside the container
        host: 8088           # default host port — installer may override

    image_pins:
      - service: freshrss
        image: freshrss/freshrss
        tag: 1.29.0-alpine

    # PRD §12.2: the capabilities freshrss re-adds above the cap_drop: ALL
    # baseline, mirrored exactly from the Compose template so the rendered
    # cap_add and this declaration stay in parity. NET_BIND_SERVICE lets Apache
    # bind port 80 inside the container; SETUID/SETGID let the Apache master
    # spawn workers as the apache user; CHOWN lets first-run init chgrp the data
    # dir. DAC_OVERRIDE / FOWNER are deliberately NOT added (verified by test).
    service_hardening:
      - service: freshrss
        capabilities:
          add:
            - NET_BIND_SERVICE
            - SETUID
            - SETGID
            - CHOWN

    networks:
      - name: freshrss
        internal: false

    resources:
      # freshrss: PHP + Apache single process; ~50 MiB resident under a
      # hundred feeds. Recommended 256m / 0.5 cpu is generous for a typical
      # personal install on a 2 GiB VPS.
      - service: freshrss
        memory:
          min: 128m
          recommended: 256m
          max: 1g
        cpus:
          min: "0.1"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 200
          max: 400
        allow_override: true

    # PRD §20: SQLite lives inside the container's data volume; no separate
    # DB process; no inter-service auth. Update path is a tag bump + recreate.
    risk_classification:
      - safe

    local_target_url_template: "http://127.0.0.1:8088"

    # Structured guidance: the install
    # result carries these fields verbatim; nothing here is parsed
    # from README prose.
    pangolin_guidance:
      target_url: "http://127.0.0.1:8088"
      recommended_subdomain: rss
      notes:
        - "Guide: https://youtu.be/tTyq9xGy1pM"
        - "Using your own reverse proxy? Point it to http://127.0.0.1:8088"

  # ============================================================================
  # Jellyfin — single-container media server, LSIO image.
  # User-host bind mounts for media libraries (read-only); PUID/PGID resolved
  # from wdm's built-in .UID / .GID, never declared here.
  # ============================================================================
  - app_id: jellyfin
    name: Jellyfin
    summary: Self-hosted media server for movies, TV, and music with hardware-accelerated transcoding.
    description: |
      Free and open-source media server for movies, TV shows, music, and
      photos. Single LSIO container with s6-overlay handling the PUID/PGID
      swap so the long-running process drops to the host user. Media
      libraries mount read-only by default — a hypothetical Jellyfin RCE
      cannot tamper with the user's library; metadata lives in /config
      inside the stack directory.
    template_name: jellyfin
    template_version: "2026-05-20"
    compose_template: templates/jellyfin/docker-compose.yml.tmpl
    env_template: templates/jellyfin/.env.tmpl

    supported_versions:
      docker: ">=20.10"
      compose: ">=2.0"

    placeholders:
      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

      # File-creation mask — string so YAML preserves "022" as octal, not
      # decimal 22. The Compose template carries no default; the catalog
      # default fills in for users who do not override.
      - name: UMASK
        type: string
        required: false
        default: "022"

      # User-host bind mounts: absolute paths outside the
      # stack directory. internal/core validates each path at install
      # planning time (must be absolute, must exist, must not be inside
      # the stack dir — symlinks resolved before the check). The :ro mount
      # mode lives in the Compose template's volume line per the schema's
      # "compose owns the mount declaration" pattern (mirrors how
      # additional_files.mount documents an existing compose mount).
      - name: MEDIA_PATH
        type: path
        required: true
      - name: MOVIES_PATH
        type: path
        required: true
      - name: SHOWS_PATH
        type: path
        required: true

    ports:
      - service: jellyfin
        container: 8096
        host: 8096

    image_pins:
      - service: jellyfin
        image: lscr.io/linuxserver/jellyfin
        tag: 10.11.8

    # PRD §12.2: the capabilities jellyfin re-adds above the cap_drop: ALL
    # baseline, mirrored exactly from the Compose template so the rendered
    # cap_add and this declaration stay in parity. These are the minimal caps
    # s6-overlay needs at startup to chown /config and drop privileges to
    # PUID:PGID via s6-setuidgid; no NET_* / SYS_* caps.
    service_hardening:
      - service: jellyfin
        capabilities:
          add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER

    networks:
      - name: jellyfin
        internal: false

    resources:
      # jellyfin: idle ~150 MiB; one direct-play stream <50 MiB extra; one
      # 1080p software transcode ~600 MiB and ~1.5 cpu. Recommended 1g / 2
      # cpu covers a small VPS doing one transcode + browsing; min covers
      # idle + metadata; max is the override ceiling for multi-stream
      # transcoding hosts (NOT auto-selected). pids cap matches ffmpeg
      # thread sprawl observed under load.
      - service: jellyfin
        memory:
          min: 512m
          recommended: 1g
          max: 8g
        cpus:
          min: "0.5"
          recommended: "2.0"
          max: "8.0"
        pids:
          default: 500
          max: 1000
        allow_override: true

    # PRD §20: single-service, no DB, media files are :ro. Update path is
    # a tag bump + recreate; metadata stored in /config survives recreate.
    risk_classification:
      - safe

    local_target_url_template: "http://127.0.0.1:8096"

    # Structured guidance: the install
    # result carries these fields verbatim; nothing here is parsed
    # from README prose.
    pangolin_guidance:
      target_url: "http://127.0.0.1:8096"
      recommended_subdomain: jellyfin
      notes:
        - "Guide: https://youtu.be/tTyq9xGy1pM"
        - "Using your own reverse proxy? Point it to http://127.0.0.1:8096"

  # ============================================================================
  # n8n — three-service workflow automation: Postgres + editor + isolated runner.
  # Two of three networks are --internal; init-data.sh creates a non-root
  # postgres user so n8n never has DB superuser access. SQL-identifier
  # placeholders (POSTGRES_USER, POSTGRES_DB, POSTGRES_NON_ROOT_USER) are
  # forbidden by the SQL-identifier denylist — they live as catalog-fixed
  # literals in .env.tmpl, not as placeholders here.
  # ============================================================================
  - app_id: n8n
    name: n8n
    summary: Self-hosted workflow automation platform with 400+ integrations and a visual builder.
    description: |
      Open-source workflow automation platform — a self-hosted alternative
      to Zapier and Make. Three-container split: a Postgres backend, the
      n8n editor / webhook server, and a separate task-runner container
      that executes user Code/Function nodes in isolation. Two of the three
      networks are created --internal: the database network has no internet
      egress, and the runner network has no internet egress (Code nodes
      cannot make outbound calls from JavaScript — use the HTTP Request
      node for that). N8N_RUNNERS_AUTH_TOKEN secures the broker RPC; the
      encryption key cannot be rotated without losing saved credentials.
    template_name: n8n
    template_version: "2026-06-11"
    compose_template: templates/n8n/docker-compose.yml.tmpl
    env_template: templates/n8n/.env.tmpl

    supported_versions:
      docker: ">=20.10"
      compose: ">=2.0"

    placeholders:
      # Postgres superuser password — used by the postgres entrypoint on
      # first-run init. regenerable=false because the init-data.sh script
      # that creates the non-root user runs once on fresh DB init; rotating
      # the superuser password later would require ALTER USER orchestration
      # wdm does not perform.
      - name: POSTGRES_PASSWORD
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # Non-root DB user password — n8n connects with this. The init-data.sh
      # script interpolates this value as a SQL string literal (single-quoted
      # inside CREATE USER ... WITH PASSWORD '${VAR}'), which is safe.
      # Identifier safety is enforced separately: the user name itself is
      # catalog-fixed in .env.tmpl, never user-modifiable. regenerable=false:
      # rotation would require ALTER USER inside the postgres container.
      - name: POSTGRES_NON_ROOT_PASSWORD
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # n8n encryption key — encrypts saved workflow credentials in the
      # database. regenerable=false: rotating this key after credentials have
      # been saved makes those credentials unrecoverable (data loss).
      - name: N8N_ENCRYPTION_KEY
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # Shared n8n <-> runner authentication token. regenerable=false: the
      # token must match in both containers, and rotation without a
      # coordinated restart of both processes leaves the runner unable to
      # claim tasks. wdm does not orchestrate this dance.
      - name: N8N_RUNNERS_AUTH_TOKEN
        type: secret
        required: true
        encoding: hex
        regenerable: false

      # Public hostname. The .env.tmpl derives WEBHOOK_URL from this single
      # placeholder via env templating: WEBHOOK_URL=https://{{ .N8N_HOST }}/.
      # No separate WEBHOOK_URL placeholder — one input, two env vars.
      - name: N8N_HOST
        type: domain
        required: true

      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

    ports:
      - service: n8n
        container: 5678
        host: 5678
        # Note: 5679 (broker RPC) and 5680 (runner health) are intentionally
        # NOT declared here — they have no host:port mapping in the Compose
        # template (host kernel never sees them), and the n8n-runners network
        # is --internal. Catalog ports declare host-exposed ports only.

    image_pins:
      - service: postgres
        image: postgres
        tag: "18.4"
      - service: n8n
        image: docker.n8n.io/n8nio/n8n
        tag: 2.21.4
      - service: runner
        image: n8nio/runners
        tag: 2.21.4

    # PRD §12.2: the capabilities postgres re-adds above the cap_drop: ALL
    # baseline, mirrored exactly from the Compose template so the rendered
    # cap_add and this declaration stay in parity. These are the minimal caps
    # the postgres entrypoint uses for first-run init + privilege drop to
    # postgres:postgres. The n8n and runner services add no capabilities.
    service_hardening:
      - service: postgres
        capabilities:
          add:
            - CHOWN
            - SETGID
            - SETUID
            - DAC_OVERRIDE
            - FOWNER

    networks:
      # Front: reverse proxy reaches n8n here (or via 127.0.0.1:5678).
      - name: n8n-front
        internal: false
      # Backend DB: n8n <-> postgres only, no internet egress.
      - name: n8n-db
        internal: true
      # Backend runner: n8n <-> runner only, no internet egress. Code nodes
      # therefore cannot make outbound HTTP calls by default — that is the
      # security boundary, not the listen address.
      - name: n8n-runners
        internal: true

    additional_files:
      # Postgres init-data.sh creates the non-root user and grants privileges.
      # This declaration triggers the schema's SQL-identifier denylist:
      # no placeholder above may be named POSTGRES_USER, POSTGRES_DB,
      # POSTGRES_NON_ROOT_USER, or any other entry in the denylist — those
      # values live as catalog-fixed literals in .env.tmpl. The script
      # interpolates user identifiers from env vars at first-run init;
      # identifier values are catalog-controlled, password values flow
      # through as quoted SQL string literals.
      - src: init-data.sh
        dest: init-data.sh
        mode: "0755"
        mount: ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro

    resources:
      # postgres: workflow execution metadata + history; modest write rate
      # for personal automation. Recommended 512m / 0.5 cpu suffices on a
      # small VPS; min covers postgres 18 idle; max is the override ceiling
      # for users with thousands of executions per day.
      - service: postgres
        memory:
          min: 256m
          recommended: 512m
          max: 2g
        cpus:
          min: "0.25"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 200
          max: 400
        allow_override: true

      # n8n: editor + webhook server; main process holds compiled workflows.
      # Recommended 1g / 1.0 cpu handles a personal automation set; min
      # covers the Node.js runtime + small workflow set; max is the override
      # ceiling for users with hundreds of active triggers.
      - service: n8n
        memory:
          min: 512m
          recommended: 1g
          max: 4g
        cpus:
          min: "0.25"
          recommended: "1.0"
          max: "4.0"
        pids:
          default: 500
          max: 1000
        allow_override: true

      # runner: Code/Function node sandbox; spikes only when workflows
      # execute JavaScript. Recommended 512m / 0.5 cpu absorbs typical
      # burst load; min is the idle Node.js process; max is the override
      # ceiling for users running heavy in-process JS.
      - service: runner
        memory:
          min: 256m
          recommended: 512m
          max: 2g
        cpus:
          min: "0.25"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 300
          max: 600
        allow_override: true

    # PRD §20: stack contains a Postgres instance the user owns (database
    # tag — triggers the warning + explicit --accept-database-risk
    # confirmation), and the three-service split with an init script + a
    # task-runner broker is non-trivial coordination (complex tag).
    risk_classification:
      - database
      - complex

    local_target_url_template: "http://127.0.0.1:5678"

    # Structured guidance: the install
    # result carries these fields verbatim; nothing here is parsed
    # from README prose.
    pangolin_guidance:
      target_url: "http://127.0.0.1:5678"
      recommended_subdomain: n8n
      notes:
        - "Guide: https://youtu.be/tTyq9xGy1pM"
        - "Using your own reverse proxy? Point it to http://127.0.0.1:5678"

  # ============================================================================
  # Navidrome — single-container music server, upstream-official image.
  # SQLite lives inside a named data volume; the music library is a read-only
  # user-host bind mount (MUSIC_PATH, type: path). The distroless image ships
  # no non-root user, so the container runs as root with cap_drop: ALL and no
  # added capabilities (navidrome itself declares no service_hardening).
  # ============================================================================
  - app_id: navidrome
    name: Navidrome
    summary: Self-hosted music server and streamer with a modern web UI and broad Subsonic-client support.
    description: |
      Free and open-source music server and streamer. Stream your personal
      music collection from any browser or Subsonic/OpenSubsonic client, with
      on-the-fly transcoding, multi-user accounts, and optional Last.fm and
      Spotify integration. Single upstream-official container with SQLite in a
      named data volume; the music library mounts read-only — a hypothetical
      Navidrome RCE cannot tamper with the user's files. The distroless image
      provides no non-root user, so the container runs as root contained by
      cap_drop: ALL (zero added capabilities) and no-new-privileges.
    template_name: navidrome
    template_version: "2026-06-14"
    compose_template: templates/navidrome/docker-compose.yml.tmpl
    env_template: templates/navidrome/.env.tmpl

    supported_versions:
      docker: ">=20.10"
      compose: ">=2.0"

    placeholders:
      # User-host bind mount: absolute path outside the stack
      # directory. internal/core validates it at install planning time (must
      # be absolute, must exist, must not be inside the stack dir — symlinks
      # resolved before the check). The :ro mount mode lives in the Compose
      # template's volume line per the schema's "compose owns the mount
      # declaration" pattern.
      - name: MUSIC_PATH
        type: path
        required: true

      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

    ports:
      - service: navidrome
        container: 4533     # navidrome's internal HTTP + Subsonic-API port
        host: 4533          # default host port — installer may override

    image_pins:
      - service: navidrome
        image: deluan/navidrome
        tag: 0.61.2

    networks:
      - name: navidrome
        internal: false

    resources:
      # navidrome: single Go binary; idles ~21 MiB / 9 pids, spikes only on
      # transcode and library scans. Recommended 256m / 0.5 cpu is generous
      # for a typical personal install on a 2 GiB VPS; min covers idle with
      # spare for one scan; max is the override ceiling for large libraries
      # with concurrent transcoding (NOT the auto-selected default).
      - service: navidrome
        memory:
          min: 128m
          recommended: 256m
          max: 1g
        cpus:
          min: "0.1"
          recommended: "0.5"
          max: "2.0"
        pids:
          default: 200
          max: 400
        allow_override: true

    # PRD §20: single-service, SQLite inside a named volume, no separate DB
    # process, no inter-service auth, music files are :ro. Update path is a
    # tag bump + recreate; the data volume survives recreate.
    risk_classification:
      - safe

    local_target_url_template: "http://127.0.0.1:4533"

    # Structured guidance: the install
