    placeholders:
      # Public hostname. The .env.tmpl derives NEXT_PUBLIC_APP_URL from this
      # single placeholder via env templating:
      # NEXT_PUBLIC_APP_URL=https://{{ .SERPBEAR_DOMAIN }}.
      # serpbear uses it for the CSRF origin, OAuth callbacks, and emails,
      # so it must be the public reverse-proxy host. One input, one URL.
      - name: SERPBEAR_DOMAIN
        type: domain
        required: true

      # Dashboard login username (maps to USER_NAME). User-configurable;
      # defaults to admin. Not a secret — the matching password is.
      - name: SERPBEAR_USER
        type: string
        required: false
        default: admin

      # Admin login password (maps to PASSWORD) — wdm generates it via
      # crypto/rand. regenerable=false: rotating it
      # invalidates the current login (no data loss), so wdm reuses the
      # existing value from .env via state.ReadStackEnv.
      - name: SERPBEAR_PASSWORD
        type: secret
        required: true
        encoding: base64url
        regenerable: false

      # Session JWT signing secret (maps to SECRET). regenerable=false:
      # rotating it logs everyone out (no data loss); the value is reused
      # from .env on update.
      - name: SERPBEAR_SECRET
        type: secret
        required: true
        encoding: hex
        regenerable: false

      # REST API bearer token (maps to APIKEY). regenerable=false: rotating
      # it breaks existing API clients (no data loss); the value is reused
      # from .env on update.
      - name: SERPBEAR_APIKEY
        type: secret
        required: true
        encoding: hex
        regenerable: false

      # Timezone — empty triggers wdm system lookup.
      - name: TZ
        type: timezone
        required: false

    ports:
      - service: serpbear
        container: 3000     # Next.js inside the container
        host: 3009          # default host port — installer may override

    image_pins:
      - service: serpbear
        image: towfiqi/serpbear
        tag: 3.1.0

    networks:
      # Front: reverse proxy reaches serpbear here (or via 127.0.0.1:3009).
      # Egress is required for serpbear's scraping/search APIs.
      - name: serpbear
        internal: false

    first_run_notes:
      - "Your SerpBear admin login is the configured username (USER_NAME, default 'admin'); the generated password is the PASSWORD= line in ~/docker/serpbear/.env."

    resources:
      # serpbear: single Next.js process backed by SQLite; idle ~110 MiB /
