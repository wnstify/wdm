  # Clean non-root: the image's built-in `nextjs` user (UID 1001) owns /app,
  # so the template adds NO caps and sets no `user:` override (forcing a UID
  # breaks the SQLite open — verified in testing). Data lives in a named
  # volume so Docker seeds it nextjs-owned. NEXT_PUBLIC_APP_URL is derived
  # from the single SERPBEAR_DOMAIN input.
  # ============================================================================
  - app_id: serpbear
    name: SerpBear
    summary: Self-hosted search-engine keyword rank tracker with a REST API and Search Console integration.
    description: |
      Free, open-source SEO rank tracker. Track keyword positions on Google
      over time, group keywords by domain, and read ranking data through a
      built-in REST API — all self-hosted with no per-keyword fees. Single
      Next.js container with SQLite under /app/data; the image runs as its
      built-in non-root `nextjs` user (UID 1001), so the stack drops all
      capabilities and adds none. The data dir is a named volume so Docker
      seeds it nextjs-owned and SQLite opens cleanly. Optional Google Search
      Console and SMTP integrations are config-only env hints.
    template_name: serpbear
    template_version: "2026-06-14"
    compose_template: templates/serpbear/docker-compose.yml.tmpl
    env_template: templates/serpbear/.env.tmpl

    supported_versions:
      docker: ">=20.10"
