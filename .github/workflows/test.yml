name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Check catalog freshness
        env:
          WDM_CATALOG_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make catalog-freshness catalog-freshness-test release-notes-test
      - name: Test and coverage
        env:
          WDM_COVERAGE_PROFILE: coverage.out
          WDM_COVERAGE_FILTERED_PROFILE: coverage-filtered.out
          WDM_COVERAGE_SUMMARY: coverage-summary.txt
        run: make coverage-check
      - name: Upload coverage to Codecov
        if: github.repository == 'wnstify/wdm' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          use_oidc: true
          files: coverage-filtered.out
          disable_search: true
          flags: go
          name: wdm-go
          fail_ci_if_error: true
          verbose: true
