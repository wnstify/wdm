name: dco

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify DCO signoffs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "$zero_sha" ]; then
            echo "No prior commit range to check for this event."
            exit 0
          fi

          # One commit by the project owner predates this DCO gate and cannot be
          # signed retroactively without rewriting 167 descendant commits on the
          # protected dev branch. Grandfather it by exact SHA; every other commit
          # is still strictly checked.
          legacy_exempt="7640ac3c16a1f7a957699cc748ddb7e46520ccef"

          missing=0
          while IFS= read -r commit; do
            if [ "$commit" = "$legacy_exempt" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer."
              git log -1 --format='  %h %s' "$commit"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head")

          if [ "$missing" -ne 0 ]; then
            echo "Add a Developer Certificate of Origin signoff with: git commit -s"
            exit 1
          fi

          echo "All non-merge commits in $base..$head include DCO signoffs."
