name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze-go
    permissions:
      security-events: write
      contents: read
      actions: read
    # SARIF upload requires GitHub Code Security. Skip the job while the
    # repository payload reports a visibility where upload is unavailable;
    # otherwise analysis burns minutes and the upload step fails with no
    # useful result. The job runs automatically once the hosted security
    # feature is active.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: go
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
