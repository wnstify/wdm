name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: analyze-go
    # SARIF upload requires GitHub Code Security. Skip the job while the
    # repository payload reports a visibility where upload is unavailable;
    # otherwise analysis burns minutes and the upload step fails with no
    # useful result. The job runs automatically once the hosted security
    # feature is active.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Analyze
        uses: github/codeql-action/analyze@v4
