name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze-go
    permissions:
      security-events: write
      contents: read
      actions: read
    # SARIF upload requires GitHub Code Security. Skip the job while the
    # repository payload reports a visibility where upload is unavailable;
    # otherwise analysis burns minutes and the upload step fails with no
    # useful result. The job runs automatically once the hosted security
    # feature is active.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          languages: go
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
