name: codeql

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: analyze-go
    # SARIF upload requires GitHub Code Security. Skip the job while the
    # repository payload reports a visibility where upload is unavailable;
    # otherwise analysis burns minutes and the upload step fails with no
    # useful result. The job runs automatically once the hosted security
    # feature is active.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          languages: go
      - name: Analyze
        uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
