# Real-Docker e2e regression tripwire — NOT a required check.
#
# Role: a low-frequency safety net for the tests/e2e/ suite (build tag
# docker_e2e), which installs a real stack via the pkg/engine facade
# against a real Docker daemon. The curated-app smoke matrix is
# the authoritative release gate; this workflow only catches regressions
# between smoke runs.
#
# Triggers:
#   - schedule: one weekly run as a background tripwire.
#   - workflow_dispatch: on-demand manual run.
#   - push on dev, limited to this file: lets the workflow prove itself
#     on the push that lands it.
#
# Note: GitHub resolves schedule and workflow_dispatch from the DEFAULT
# branch (main), so those two triggers go live only once main carries
# this file. The dev-push trigger activates immediately on this push.
name: e2e

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/e2e.yml

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Run Docker e2e tests
        run: go test -tags docker_e2e -timeout 15m ./tests/e2e/...
