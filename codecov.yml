coverage:
  precision: 1
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        base: auto
    patch:
      default:
        target: 90%
        threshold: 5%

# cmd/wdm is the os.Exit bootstrap shim; it is excluded from the coverage gate
# (parity with the make coverage-check filter), so exclude it here too.
ignore:
  - "cmd/wdm/**"

# Per-layer project floors. Each target sits a couple of points below the
# measured coverage for that package so a genuine regression turns the
# component red without flapping on normal churn.
component_management:
  individual_components:
    - component_id: pkg_engine
      paths:
        - "pkg/engine/**"
      statuses:
        - type: project
          target: 95%
    - component_id: pkg_types
      paths:
        - "pkg/types/**"
      statuses:
        - type: project
          target: 95%
    - component_id: internal_core
      paths:
        - "internal/core/**"
      statuses:
        - type: project
          target: 83%
    - component_id: internal_docker
      paths:
        - "internal/docker/**"
      statuses:
        - type: project
          target: 88%
    - component_id: internal_release
      paths:
        - "internal/release/**"
      statuses:
        - type: project
          target: 86%
    - component_id: internal_catalog
      paths:
        - "internal/catalog/**"
      statuses:
        - type: project
          target: 86%
    - component_id: internal_state
      paths:
        - "internal/state/**"
      statuses:
        - type: project
          target: 82%
    - component_id: internal_security
      paths:
        - "internal/security/**"
      statuses:
        - type: project
          target: 90%

comment: false

github_checks:
  annotations: false
