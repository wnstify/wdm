<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">wdm logo</title>
  <desc id="desc">A terminal window with managed stack blocks beside the wdm wordmark.</desc>
  <rect width="720" height="200" fill="none"/>

  <g transform="translate(40 38)">
    <rect x="0" y="0" width="150" height="124" rx="16" fill="#0b1220"/>
    <rect x="0" y="0" width="150" height="124" rx="16" fill="none" stroke="#22c7d9" stroke-width="6"/>
    <path d="M4 34h142" stroke="#22c7d9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="22" cy="18" r="5" fill="#2fd47f"/>
    <circle cx="40" cy="18" r="5" fill="#22c7d9"/>
    <circle cx="58" cy="18" r="5" fill="#f5c542"/>

    <path d="M28 65l16 14-16 14" fill="none" stroke="#22c7d9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 96h30" stroke="#2fd47f" stroke-width="7" stroke-linecap="round"/>

    <g fill="#2fd47f">
      <rect x="94" y="54" width="24" height="24" rx="4"/>
      <rect x="122" y="54" width="24" height="24" rx="4" opacity=".92"/>
      <rect x="94" y="82" width="24" height="24" rx="4" opacity=".92"/>
      <rect x="122" y="82" width="24" height="24" rx="4" opacity=".82"/>
    </g>
  </g>

  <g transform="translate(225 58)" fill="#0b1220">
    <text x="0" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="82" font-weight="800" letter-spacing="0">wdm</text>
    <text x="4" y="98" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" letter-spacing="0">Webnestify Docker Manager</text>
  </g>

  <g transform="translate(225 174)">
    <rect x="0" y="0" width="84" height="8" rx="4" fill="#22c7d9"/>
    <rect x="96" y="0" width="84" height="8" rx="4" fill="#2fd47f"/>
    <rect x="192" y="0" width="84" height="8" rx="4" fill="#f5c542"/>
